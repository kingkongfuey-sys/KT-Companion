name: Build KT Companion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Verify Files
        run: |
          test -f capacitor.config.json
          test -f www/index.html
          test -f resources/icon.png
          echo "Config:"
          cat capacitor.config.json
          if [ -f www/native-export.bundle.js ]; then
            echo "Native export bundle found."
          else
            echo "::warning::www/native-export.bundle.js is missing; native image export may not work."
          fi

      - name: Add Android
        run: npx cap add android

      - name: Generate Icons
        run: npx capacitor-assets generate

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KT-Companion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
