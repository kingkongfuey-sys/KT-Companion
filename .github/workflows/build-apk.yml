name: Build KT Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Show Repository Structure
        run: |
          echo "Repository Root"
          ls -la

          echo ""
          echo "WWW Folder"
          ls -la www

          echo ""
          echo "Resources Folder"
          ls -la resources

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Adaptive Icons
        run: npx capacitor-assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android Platform
        run: |
          ls -la android
          ls -la android/app

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KT-Companion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
