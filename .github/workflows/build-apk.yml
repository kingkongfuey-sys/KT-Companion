name: Build KT Companion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Verify Files
        run: |
          echo "Root:"
          ls -la

          echo "WWW:"
          ls -la www

          echo "Resources:"
          ls -la resources

          echo "Config:"
          cat capacitor.config.json

      - name: Initialise Capacitor
        run: |
          npx cap init "KT Companion" "com.henryeveritt.ktcompanion" --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Generate Icons
        run: npx capacitor-assets generate

      - name: Sync Android
        run: npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KT-Companion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
